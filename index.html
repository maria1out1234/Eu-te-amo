<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            font-family: Arial, sans-serif;
        }
        .heart {
            width: 100px;
            height: 100px;
            background-color: pink;
            position: relative;
            animation: pulse 1.5s infinite;
        }
        .heart:before, .heart:after {
            content: '';
            width: 100px;
            height: 100px;
            background-color: pink;
            border-radius: 50%;
            position: absolute;
        }
        .heart:before {
            top: -50px;
            left: 0;
        }
        .heart:after {
            left: 50px;
            top: 0;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        .countdown {
            font-size: 2em;
            margin-top: 20px;
        }
        .hidden-content {
            display: none;
            margin-top: 20px;
        }
        .reveal-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: pink;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="heart"></div>
<h1>We have been together for 8 months and 26 days!</h1>

<div class="countdown" id="countdown-timer"></div>

<button class="reveal-button" onclick="revealContent()">Reveal Hidden Content</button>
<div class="hidden-content" id="hidden-content">
    <p>This is some hidden content that expresses how much I love you!</p>
</div>

<iframe src="https://open.spotify.com/embed/track/YOUR_TRACK_ID" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>

<script>
    const countdownDate = new Date("2025-06-25T00:00:00Z");
    const updateCountdown = () => {
        const now = new Date().getTime();
        const distance = now - countdownDate.getTime();

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("countdown-timer").innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }
    setInterval(updateCountdown, 1000);

    function revealContent() {
        document.getElementById("hidden-content").style.display = "block";
    }
</script>

</body>
</html>
