<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o amor da minha vida 💖</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .heart {
            width: 100px;
            height: 100px;
            background: red;
            position: relative;
            animation: pulse 1.5s infinite;
        }
        .heart:before, .heart:after {
            content: '';
            width: 100px;
            height: 100px;
            background: red;
            border-radius: 50%;
            position: absolute;
        }
        .heart:before {
            top: -50px;
            left: 0;
        }
        .heart:after {
            left: 50px;
            top: 0;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <h1>Para o amor da minha vida 💖</h1>
    <div class="heart"></div>
    <p>Juntos desde 25 de junho de 2025</p>
    <div>
        <div>Há 8 meses</div>
        <div>E 24 dias</div>
        <div>São 269 dias juntos 💕</div>
        <div>Nossa música 🎶</div>
    </div>
</body>
</html>
