<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff;
        }
        .heart {
            width: 100px;
            height: 100px;
            background: pink;
            position: relative;
            animation: pulse 1.5s infinite;
        }
        .heart:before,
        .heart:after {
            content: '';
            background: pink;
            border-radius: 50%;
            position: absolute;
        }
        .heart:before {
            width: 100px;
            height: 100px;
            left: 50px;
            top: 0;
        }
        .heart:after {
            width: 100px;
            height: 100px;
            left: 0;
            top: 50px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="heart"></div>
    <div>
        <p>Original Message: "I love you more than words can say." </p>
        <h2>Remaining Time:</h2>
        <p>8 months and 26 days</p>
    </div>
    <audio controls>
        <source src="path/to/your/music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</body>
</html>
